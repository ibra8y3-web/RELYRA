<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="700" viewBox="0 0 1440 700" role="img" aria-labelledby="t d"><title id="t">RELYRA current network map</title><desc id="d">Current route is sender to user-selected Nostr WSS relays to recipient; planned transports are visibly separated. Blossom is used separately for encrypted files.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1224"/><stop offset="1" stop-color="#1b1738"/></linearGradient><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#64d6c8"/></marker><style>.h{font:700 30px Inter,Segoe UI,sans-serif;fill:#f8fafc}.s{font:400 16px Inter,Segoe UI,sans-serif;fill:#aab8d8}.l{font:700 20px Inter,Segoe UI,sans-serif;fill:#f8fafc}.b{font:400 15px Inter,Segoe UI,sans-serif;fill:#c1cce6}.tag{font:700 13px Inter,Segoe UI,sans-serif;letter-spacing:1px}.active{fill:#142f36;stroke:#48bda9;stroke-width:2}.future{fill:#181e32;stroke:#59627d;stroke-width:2;stroke-dasharray:9 8}.arrow{fill:none;stroke:#64d6c8;stroke-width:3;marker-end:url(#ar)}</style></defs><rect width="1440" height="700" rx="26" fill="url(#bg)"/><text x="58" y="62" class="h">RELYRA · NETWORK MAP</text><text x="60" y="92" class="s">Implemented connectivity vs. planned transports</text><rect x="58" y="125" width="1324" height="268" rx="22" fill="#111d32" stroke="#315b69"/><text x="88" y="164" class="tag" fill="#67e8d2">IMPLEMENTED TODAY</text><g transform="translate(95 205)"><rect width="230" height="115" rx="18" class="active"/><text x="115" y="40" text-anchor="middle" class="l">Sender device</text><text x="115" y="70" text-anchor="middle" class="b">Android app</text><text x="115" y="94" text-anchor="middle" class="b">Encrypt + sign event</text><path d="M240 58H355" class="arrow"/><rect x="368" width="280" height="115" rx="18" class="active"/><text x="508" y="37" text-anchor="middle" class="l">Nostr WSS relays</text><text x="508" y="68" text-anchor="middle" class="b">Added and enabled by user</text><text x="508" y="92" text-anchor="middle" class="b">Forward signed ciphertext</text><path d="M658 58H773" class="arrow"/><rect x="786" width="230" height="115" rx="18" class="active"/><text x="901" y="40" text-anchor="middle" class="l">Recipient device</text><text x="901" y="70" text-anchor="middle" class="b">Verify + decrypt</text><text x="901" y="94" text-anchor="middle" class="b">Save then acknowledge</text><text x="0" y="154" class="b">Relays do not receive message plaintext. They can still observe IP address, timing, routing tags and ciphertext size.</text></g><text x="60" y="438" class="tag" fill="#a5b4fc">PLANNED — NOT CONNECTED IN THIS BUILD</text><g transform="translate(60 463)"><rect width="245" height="100" rx="15" class="future"/><text x="122" y="40" text-anchor="middle" class="l">Direct P2P / libp2p</text><text x="122" y="70" text-anchor="middle" class="b">Not implemented</text><rect x="265" width="245" height="100" rx="15" class="future"/><text x="387" y="40" text-anchor="middle" class="l">ICE / STUN / TURN</text><text x="387" y="70" text-anchor="middle" class="b">Not implemented</text><rect x="530" width="245" height="100" rx="15" class="future"/><text x="652" y="40" text-anchor="middle" class="l">Tor routing</text><text x="652" y="70" text-anchor="middle" class="b">Not integrated</text><rect x="795" width="245" height="100" rx="15" class="future"/><text x="917" y="40" text-anchor="middle" class="l">Bluetooth / Wi-Fi</text><text x="917" y="70" text-anchor="middle" class="b">Nearby mesh not present</text><rect x="1060" width="245" height="100" rx="15" class="future"/><text x="1182" y="40" text-anchor="middle" class="l">MLS / Matrix / XMPP</text><text x="1182" y="70" text-anchor="middle" class="b">Not implemented</text></g><rect x="60" y="595" width="1320" height="70" rx="15" fill="#1d1b3c" stroke="#8063c7"/><text x="88" y="625" class="l">Separate attachment path</text><text x="88" y="649" class="b">Encrypt locally → upload ciphertext to configured Blossom server → send encrypted descriptor through Nostr.</text></svg>