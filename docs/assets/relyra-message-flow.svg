<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="570" viewBox="0 0 1440 570" role="img" aria-labelledby="t d"><title id="t">RELYRA message and file flow</title><desc id="d">Six steps for message delivery and four separate steps for attachment handling.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0a1021"/><stop offset="1" stop-color="#1c1740"/></linearGradient><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8e7be4"/></marker><style>.h{font:700 29px Inter,Segoe UI,sans-serif;fill:#f8fafc}.s{font:400 15px Inter,Segoe UI,sans-serif;fill:#aebada}.n{font:700 14px Inter,Segoe UI,sans-serif;fill:#c4b5fd}.t{font:700 17px Inter,Segoe UI,sans-serif;fill:#fff}.b{font:400 13px Inter,Segoe UI,sans-serif;fill:#c6d2eb}.c{fill:#172440;stroke:#5b6eaa;stroke-width:1.8}.line{stroke:#8e7be4;stroke-width:3;fill:none;marker-end:url(#ar)}</style></defs><rect width="1440" height="570" rx="26" fill="url(#bg)"/><text x="58" y="62" class="h">HOW A RELYRA MESSAGE TRAVELS</text><text x="60" y="91" class="s">From the send action to an authenticated delivery acknowledgement</text><g transform="translate(48 135)"><rect width="190" height="145" rx="16" class="c"/><text x="18" y="32" class="n">01 · CREATE</text><text x="18" y="66" class="t">Fresh message ID</text><text x="18" y="96" class="b">Persist in encrypted</text><text x="18" y="117" class="b">outbox</text><path d="M195 72H218" class="line"/><g transform="translate(230)"><rect width="190" height="145" rx="16" class="c"/><text x="18" y="32" class="n">02 · PROTECT</text><text x="18" y="66" class="t">Encrypt for peer</text><text x="18" y="96" class="b">Authenticated</text><text x="18" y="117" class="b">ciphertext payload</text></g><path d="M425 72H448" class="line"/><g transform="translate(460)"><rect width="190" height="145" rx="16" class="c"/><text x="18" y="32" class="n">03 · ROUTE</text><text x="18" y="66" class="t">Choose transport</text><text x="18" y="96" class="b">Nostr is active</text><text x="18" y="117" class="b">in this source</text></g><path d="M655 72H678" class="line"/><g transform="translate(690)"><rect width="190" height="145" rx="16" class="c"/><text x="18" y="32" class="n">04 · PUBLISH</text><text x="18" y="66" class="t">Signed Nostr event</text><text x="18" y="96" class="b">User-enabled</text><text x="18" y="117" class="b">WSS relays</text></g><path d="M885 72H908" class="line"/><g transform="translate(920)"><rect width="190" height="145" rx="16" class="c"/><text x="18" y="32" class="n">05 · RECEIVE</text><text x="18" y="66" class="t">Verify + decrypt</text><text x="18" y="96" class="b">Authenticate sender</text><text x="18" y="117" class="b">and destination</text></g><path d="M1115 72H1138" class="line"/><g transform="translate(1150)"><rect width="190" height="145" rx="16" fill="#123438" stroke="#4dbca9" stroke-width="2"/><text x="18" y="32" class="n">06 · ACK</text><text x="18" y="66" class="t">Store then confirm</text><text x="18" y="96" class="b">Same ID on retry;</text><text x="18" y="117" class="b">duplicates re-ACK</text></g></g><rect x="48" y="340" width="1344" height="186" rx="20" fill="#111d36" stroke="#3b5b88"/><text x="76" y="382" class="h">FILE ATTACHMENTS · SEPARATE PIPELINE</text><g transform="translate(80 407)"><rect width="260" height="85" rx="14" class="c"/><text x="130" y="34" class="t" text-anchor="middle">1. Encrypt locally</text><text x="130" y="59" class="b" text-anchor="middle">Fresh file key + segments</text><path d="M270 43H310" class="line"/><rect x="325" width="260" height="85" rx="14" class="c"/><text x="455" y="34" class="t" text-anchor="middle">2. Upload ciphertext</text><text x="455" y="59" class="b" text-anchor="middle">Configured Blossom server</text><path d="M595 43H635" class="line"/><rect x="650" width="260" height="85" rx="14" class="c"/><text x="780" y="34" class="t" text-anchor="middle">3. Send descriptor</text><text x="780" y="59" class="b" text-anchor="middle">Inside E2EE message</text><path d="M920 43H960" class="line"/><rect x="975" width="260" height="85" rx="14" fill="#123438" stroke="#4dbca9" stroke-width="2"/><text x="1105" y="34" class="t" text-anchor="middle">4. Manual download</text><text x="1105" y="59" class="b" text-anchor="middle">Verify hash, then decrypt</text></g></svg>