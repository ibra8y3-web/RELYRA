<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
<title id="title">RELYRA architecture overview</title>
<desc id="desc">Layered diagram showing the Android UI, application orchestration, encrypted messaging core, local secure storage, Nostr WSS relay transport, and separately encrypted Blossom file transfer.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10172d"/><stop offset="1" stop-color="#1b2850"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#48d7c6"/><stop offset="1" stop-color="#6e9cff"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#050a18" flood-opacity=".35"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#8ca9eb"/></marker>
  <style>
    .heading{font:700 34px Inter,Segoe UI,sans-serif;fill:#f7f9ff}
    .sub{font:400 15px Inter,Segoe UI,sans-serif;fill:#b9c8e9}
    .label{font:700 19px Inter,Segoe UI,sans-serif;fill:#f7f9ff}
    .body{font:400 14px Inter,Segoe UI,sans-serif;fill:#cbd6f0}
    .tiny{font:600 12px Inter,Segoe UI,sans-serif;fill:#9de9df;letter-spacing:1.2px}
    .box{fill:#202f59;stroke:#496391;stroke-width:1.5}
    .inner{fill:#182649;stroke:#3d5b8d;stroke-width:1}
    .line{fill:none;stroke:#8ca9eb;stroke-width:2.2;marker-end:url(#arrow)}
    .dashed{fill:none;stroke:#56cdbf;stroke-width:2;stroke-dasharray:7 7;marker-end:url(#arrow)}
  </style>
</defs>
<rect width="1280" height="820" rx="28" fill="url(#bg)"/>
<circle cx="1110" cy="105" r="180" fill="#325d9a" opacity=".12"/>
<circle cx="130" cy="760" r="220" fill="#39bea9" opacity=".08"/>
<text x="64" y="72" class="heading">RELYRA · SYSTEM ARCHITECTURE</text>
<text x="66" y="101" class="sub">Current source baseline · Android 10+ · Kotlin / Jetpack Compose</text>

<rect x="64" y="132" width="1152" height="94" rx="18" class="box" filter="url(#shadow)"/>
<text x="88" y="163" class="tiny">01 · PRESENTATION</text>
<text x="88" y="193" class="label">Android UI</text>
<rect x="330" y="151" width="250" height="52" rx="12" class="inner"/>
<text x="455" y="173" text-anchor="middle" class="body">Jetpack Compose</text><text x="455" y="191" text-anchor="middle" class="body">Chats · Groups · Settings</text>
<rect x="610" y="151" width="250" height="52" rx="12" class="inner"/>
<text x="735" y="173" text-anchor="middle" class="body">Arabic RTL · English</text><text x="735" y="191" text-anchor="middle" class="body">Light · Dark · AMOLED</text>
<rect x="890" y="151" width="290" height="52" rx="12" class="inner"/>
<text x="1035" y="173" text-anchor="middle" class="body">ViewModel · Navigation</text><text x="1035" y="191" text-anchor="middle" class="body">Application lifecycle</text>

<path d="M640 226 V253" class="line"/>
<rect x="64" y="258" width="1152" height="88" rx="18" class="box" filter="url(#shadow)"/>
<text x="88" y="289" class="tiny">02 · ORCHESTRATION</text>
<text x="88" y="319" class="label">Application services</text>
<rect x="380" y="278" width="235" height="48" rx="12" class="inner"/>
<text x="497" y="307" text-anchor="middle" class="body">AppContainer · Workers</text>
<rect x="645" y="278" width="235" height="48" rx="12" class="inner"/>
<text x="762" y="307" text-anchor="middle" class="body">Notifications · Lifecycle</text>
<rect x="910" y="278" width="270" height="48" rx="12" class="inner"/>
<text x="1045" y="307" text-anchor="middle" class="body">Optional foreground service</text>

<path d="M640 346 V373" class="line"/>
<rect x="64" y="378" width="1152" height="150" rx="18" class="box" filter="url(#shadow)"/>
<text x="88" y="410" class="tiny">03 · SECURE CORE</text>
<text x="88" y="440" class="label">Messaging & cryptography</text>
<rect x="350" y="399" width="245" height="104" rx="12" class="inner"/>
<text x="472" y="426" text-anchor="middle" class="label">Delivery Engine</text>
<text x="472" y="453" text-anchor="middle" class="body">Outbox · IDs · ACKs</text>
<text x="472" y="475" text-anchor="middle" class="body">Retry · Deduplication</text>
<rect x="620" y="399" width="255" height="104" rx="12" class="inner"/>
<text x="747" y="426" text-anchor="middle" class="label">Payload Protector</text>
<text x="747" y="453" text-anchor="middle" class="body">X25519 · HKDF · AES-GCM</text>
<text x="747" y="475" text-anchor="middle" class="body">One-to-one Double Ratchet</text>
<rect x="900" y="399" width="280" height="104" rx="12" class="inner"/>
<text x="1040" y="426" text-anchor="middle" class="label">AdaptiveRouter</text>
<text x="1040" y="453" text-anchor="middle" class="body">Transport / Connector</text>
<text x="1040" y="475" text-anchor="middle" class="body">Nostr is registered today</text>
<path d="M595 450 H615" class="line"/><path d="M875 450 H895" class="line"/>

<path d="M1040 528 V556" class="line"/>
<rect x="64" y="561" width="740" height="112" rx="18" class="box" filter="url(#shadow)"/>
<text x="88" y="592" class="tiny">04 · MESSAGE TRANSPORT</text>
<text x="88" y="622" class="label">Nostr · WSS relays</text>
<rect x="385" y="584" width="185" height="64" rx="12" class="inner"/>
<text x="477" y="610" text-anchor="middle" class="body">Signed event</text><text x="477" y="630" text-anchor="middle" class="body">Kind 4747</text>
<rect x="590" y="584" width="185" height="64" rx="12" class="inner"/>
<text x="682" y="610" text-anchor="middle" class="body">User-enabled</text><text x="682" y="630" text-anchor="middle" class="body">WSS endpoints</text>
<path d="M570 616 H585" class="line"/>
<rect x="832" y="561" width="384" height="112" rx="18" class="box" filter="url(#shadow)"/>
<text x="856" y="592" class="tiny">05 · LOCAL DATA</text>
<text x="856" y="622" class="label">Protected on device</text>
<text x="856" y="648" class="body">Room + SQLCipher · Android Keystore · Encrypted Vault</text>

<path d="M745 503 C745 535 475 535 475 579" class="dashed"/>
<text x="64" y="716" class="tiny">SEPARATE FILE PATH</text>
<rect x="64" y="733" width="1152" height="60" rx="16" fill="#173b51" stroke="#3d8d91" stroke-width="1.5"/>
<text x="88" y="758" class="label">Blossom file transfer</text>
<text x="360" y="758" class="body">File encrypted locally → ciphertext uploaded → encrypted descriptor sent in the message</text>
<text x="88" y="780" class="body">Planned, not implemented: direct P2P · libp2p · Tor · Bluetooth/Wi-Fi Direct · MLS · calls</text>
</svg>