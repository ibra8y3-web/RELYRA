[package]
name = "relyra-mls-native"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
publish = false

[lib]
name = "relyra_mls"
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22.1"
jni = "0.22.4"
openmls = { git = "https://github.com/openmls/openmls", rev = "6100df3fb1d8c3eeab53e349fcbd621f98c44fe2" }
openmls_basic_credential = { git = "https://github.com/openmls/openmls", rev = "6100df3fb1d8c3eeab53e349fcbd621f98c44fe2" }
openmls_rust_crypto = { git = "https://github.com/openmls/openmls", rev = "6100df3fb1d8c3eeab53e349fcbd621f98c44fe2" }
openmls_sqlite_storage = { path = "vendor/openmls_sqlite_storage" }
openmls_traits = { git = "https://github.com/openmls/openmls", rev = "6100df3fb1d8c3eeab53e349fcbd621f98c44fe2" }
rusqlite = { version = "=0.42.0", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tls_codec = { version = "0.5.0", features = ["derive"] }
zeroize = "1.8"

[dev-dependencies]
tempfile = "3.23"

[patch.crates-io]
refinery-core = { path = "vendor/refinery_core" }
