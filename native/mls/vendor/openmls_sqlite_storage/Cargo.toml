[package]
name = "openmls_sqlite_storage"
version = "0.3.0"
edition = "2021"
rust-version = "1.94"
description = "An OpenMLS SQLCipher storage provider based on rusqlite."
license = "MIT"
publish = false

[dependencies]
openmls_traits = { git = "https://github.com/openmls/openmls", rev = "6100df3fb1d8c3eeab53e349fcbd621f98c44fe2" }
serde = { version = "1.0", features = ["derive"] }
rusqlite = "=0.42.0"
refinery = { version = "0.10", features = ["rusqlite", "enums"] }

[features]
extensions-draft = ["openmls_traits/extensions-draft"]
draft-ietf-mls-pq-ciphersuites = ["openmls_traits/draft-ietf-mls-pq-ciphersuites"]
virtual-clients-draft = ["extensions-draft", "openmls_traits/virtual-clients-draft"]
