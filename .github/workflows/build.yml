name: Build RELYRA

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# One build lane for the whole repository: a newer run cancels older work.
concurrency:
  group: relyra-build-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      # Remove stale queued/running workflows from older commits across all branches.
      # Compare creation timestamps so a newer run can never be cancelled by an older run.
      - name: Cancel older RELYRA build runs
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_created="$(gh run view "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --json createdAt --jq '.createdAt')"
          gh run list --repo "$GITHUB_REPOSITORY" --workflow build.yml --limit 100 --json databaseId,status,createdAt \
            | jq -r --arg current "$GITHUB_RUN_ID" --arg created "$current_created" '.[] | select((.databaseId | tostring) != $current and (.status == "queued" or .status == "in_progress") and .createdAt < $created) | .databaseId' \
            | while IFS= read -r run_id; do
                [ -n "$run_id" ] || continue
                gh run cancel "$run_id" --repo "$GITHUB_REPOSITORY" || true
              done

      - name: Validate docs and Arabic/English resources
        run: python3 scripts/verify_project.py

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 "platforms;android-37.0" "build-tools;37.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.6.0

      # Tests run first; failing tests must not leave a misleading ready-to-install APK.
      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: relyra-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: relyra-test-reports
          path: app/build/reports/tests/