name: Build RELYRA

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# All RELYRA build triggers share one queue. A new commit/PR validation
# supersedes any previous build, even when it comes from another branch.
concurrency:
  group: relyra-build-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Cancel older RELYRA build runs
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --repo "$GITHUB_REPOSITORY" --workflow build.yml --limit 100 --json databaseId,status \
            | jq -r --arg current "$GITHUB_RUN_ID" '.[] | select((.databaseId | tostring) != $current and (.status == "queued" or .status == "in_progress")) | .databaseId' \
            | while read -r run_id; do
                [ -n "$run_id" ] && gh run cancel "$run_id" --repo "$GITHUB_REPOSITORY"
              done

      - name: Validate docs and Arabic/English resources
        run: python3 scripts/verify_project.py

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 "platforms;android-37.0" "build-tools;37.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.6.0

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: relyra-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: relyra-test-reports
          path: app/build/reports/tests/