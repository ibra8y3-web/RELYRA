name: Build RELYRA

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs only on the same branch/ref. Runs from other branches
# must not cancel this branch's unit-test job.
concurrency:
  group: relyra-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discovery-service:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.0"
          cache-dependency-path: services/discovery/go.mod
      - name: Resolve Go modules
        working-directory: services/discovery
        run: go mod tidy
      - name: Run discovery protocol tests
        working-directory: services/discovery
        run: go test -race ./...
      - name: Vet discovery service
        working-directory: services/discovery
        run: go vet ./...
      - name: Build discovery container
        run: docker build -f services/discovery/Dockerfile -t relyra-discovery:ci services/discovery

  mls-native:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/mls -> target
      - name: Run OpenMLS and SQLCipher integration tests
        working-directory: native/mls
        run: cargo test --locked 2>/dev/null || cargo test

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Validate docs and Arabic/English resources
        run: python3 scripts/verify_project.py

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 "platforms;android-37.0" "build-tools;37.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.6.0

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: relyra-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Unit tests
        timeout-minutes: 45
        run: gradle --no-daemon --console=plain --info testDebugUnitTest

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: relyra-test-reports
          path: app/build/reports/tests/
