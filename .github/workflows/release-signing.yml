name: RELYRA Signed Release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-release:
    name: Build, sign and attest release APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          gradle-version: 9.6.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android,x86_64-linux-android
      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 \
            "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.2.12479018" > /dev/null
      - name: Validate signing secret and install private keystore
        env:
          RELYRA_RELEASE_KEYSTORE_BASE64: ${{ secrets.RELYRA_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$RELYRA_RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::Repository secret RELYRA_RELEASE_KEYSTORE_BASE64 is not configured."
            exit 1
          fi
          keystore="$RUNNER_TEMP/relyra-release.jks"
          printf '%s' "$RELYRA_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          test -s "$keystore"
          echo "RELYRA_RELEASE_STORE_FILE=$keystore" >> "$GITHUB_ENV"
      - name: Build OpenMLS Android libraries
        run: bash scripts/build_mls_android.sh
      - name: Assemble signed release APK
        env:
          RELYRA_RELEASE_STORE_PASSWORD: ${{ secrets.RELYRA_RELEASE_STORE_PASSWORD }}
          RELYRA_RELEASE_KEY_ALIAS: ${{ secrets.RELYRA_RELEASE_KEY_ALIAS }}
          RELYRA_RELEASE_KEY_PASSWORD: ${{ secrets.RELYRA_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$RELYRA_RELEASE_STORE_PASSWORD" ]; then
            echo "::error::Repository secret RELYRA_RELEASE_STORE_PASSWORD is not configured."
            exit 1
          fi
          if [ -z "$RELYRA_RELEASE_KEY_ALIAS" ]; then
            echo "::error::Repository secret RELYRA_RELEASE_KEY_ALIAS is not configured."
            exit 1
          fi
          if [ -z "$RELYRA_RELEASE_KEY_PASSWORD" ]; then
            echo "::error::Repository secret RELYRA_RELEASE_KEY_PASSWORD is not configured."
            exit 1
          fi
          gradle --no-daemon --console=plain assembleRelease
      - name: Verify APK signature
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs "$apk"
      - name: Attest signed APK provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: app/build/outputs/apk/release/app-release.apk
      - name: Upload signed APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: relyra-signed-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/relyra-release.jks"
