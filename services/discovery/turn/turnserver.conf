# RELYRA uses time-limited TURN REST credentials generated by the discovery API.
# The shared secret is passed as --static-auth-secret at container startup.
listening-port=3478
fingerprint
use-auth-secret
stale-nonce=600
no-loopback-peers
no-multicast-peers
user-quota=4
total-quota=200
max-bps=1048576
bps-capacity=20000000
min-port=49160
max-port=49200

# The deployment exposes TURN over UDP and TCP on 3478. TLS is deliberately
# disabled until an operator provisions and mounts valid cert/key files.
no-tls
no-dtls
